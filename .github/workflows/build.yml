name: Build debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Belt-and-braces: make sure Actions' git client never rewrites
          # line endings on checkout, which would corrupt the binary
          # gradle-wrapper.jar even if .gitattributes is somehow ignored.
          fetch-depth: 1

      - name: Verify Gradle Wrapper integrity
        run: |
          set -e
          JAR=gradle/wrapper/gradle-wrapper.jar
          if [ ! -f "$JAR" ]; then
            echo "::error::$JAR is missing from the checkout."
            exit 1
          fi
          SIZE=$(stat -c%s "$JAR")
          echo "Wrapper jar size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::$JAR is suspiciously small ($SIZE bytes) - it is likely corrupted or was committed as a text/LFS pointer instead of the real binary."
            exit 1
          fi
          if ! unzip -l "$JAR" | grep -q "org/gradle/wrapper/GradleWrapperMain.class"; then
            echo "::error::$JAR does not contain org/gradle/wrapper/GradleWrapperMain.class - the jar is corrupted."
            exit 1
          fi
          echo "Gradle Wrapper jar looks valid."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Print wrapper diagnostics
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== repo root listing ==="
          ls -la
          echo "=== gradle/wrapper listing ==="
          ls -la gradle/wrapper
          echo "=== file types ==="
          file gradlew
          file gradle/wrapper/gradle-wrapper.jar
          echo "=== GradleWrapperMain present in jar? ==="
          jar tf gradle/wrapper/gradle-wrapper.jar | grep GradleWrapperMain
          echo "=== CLASSPATH construction in gradlew ==="
          grep -n "CLASSPATH" ./gradlew
          echo "=== direct classpath sanity check (bypasses the shell script entirely) ==="
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
