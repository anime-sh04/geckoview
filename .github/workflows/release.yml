# OPTIONAL release workflow. Kept separate from build.yml on purpose.
#
# Unlike the debug workflow, a real Play-Store-installable release APK/AAB
# must be signed. That requires you to first:
#   1. Generate an upload keystore (e.g. `keytool -genkeypair -v -keystore
#      release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000`).
#   2. Base64-encode it and store it as a GitHub Actions secret
#      (e.g. RELEASE_KEYSTORE_BASE64), plus secrets for the store/key
#      passwords and key alias.
#   3. Wire those secrets into app/build.gradle.kts under a `signingConfigs`
#      block referenced by the `release` buildType.
#
# This workflow is intentionally left as a manual-only skeleton -- it will
# NOT run automatically, and assembleRelease will fail until you add a
# signing config as described above.

name: Build release APK (manual, requires signing setup)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-release:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Uncomment once signingConfigs are wired up in app/build.gradle.kts:
      # - name: Decode signing keystore
      #   run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        # env:
        #   RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        #   RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        #   RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
